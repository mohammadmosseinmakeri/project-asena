[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asena"
version = "0.1.0"
description = "An open-source modular AI Desktop Agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mohammad Hossein Zakeri" }
]
[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.16",
]
[project.urls]
Repository = "https://github.com/mohammadhosseinzakeri10/project-asena"

[tool.setuptools.packages.find]
where = ["src"]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"


# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["asena"]

[tool.coverage.report]
show_missing = true
skip_covered = true
